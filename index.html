
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Music Player</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      color: white;
      font-family: Arial, sans-serif;
    }

    .player {
      width: min(340px, 90vw);
      padding: 28px 22px;
      text-align: center;
      background: #202020;
      border-radius: 18px;
    }

    .music-icon {
      font-size: 58px;
      margin-bottom: 14px;
    }

    h2 {
      font-size: 20px;
      margin: 0 0 8px;
    }

    p {
      font-size: 13px;
      color: #aaa;
      margin-bottom: 20px;
    }

    #player-frame {
      width: 100%;
      min-height: 90px;
      border: 0;
      border-radius: 10px;
    }
    .audio-player {
  width: 100%;
  height: 90px;
  overflow: hidden;
  border-radius: 10px;
}

.audio-player iframe {
  width: 100%;
  height: 90px;
  border: 0;
}
  </style>
</head>
<body>
  <main class="player">
    <div class="music-icon">♫</div>
    <h2>Your Music</h2>
    <p>Enjoy listening</p>
    <div id="player-container" class="audio-player"></div>
  </main>

  <script src="player.js"></script>
</body>
</html>
